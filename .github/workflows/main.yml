name: Build iOS IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clone Arc next to Mindustry
        run: |
          git clone https://github.com/Anuken/Arc ../Arc
          git -C ../Arc checkout 7445105cd2

      - name: Fetch MetalANGLEKit frameworks
        run: ./gradlew :Arc:backends:backend-robovm:extractMetalANGLEKit

      - name: Check frameworks landed
        run: ls -la ../Arc/backends/backend-robovm/res/META-INF/robovm/ios/libs

      - name: Build IPA
        run: ./gradlew ios:createIPA -Probovm.iosSkipSigning=true

      - name: Find IPA
        if: always()
        run: find . -name '*.ipa' || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-ipa
          path: ios/build/robovm/*.ipa
          if-no-files-found: error
