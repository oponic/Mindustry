name: Build iOS IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build IPA
        run: ./gradlew ios:createIPA -Probovm.iosSkipSigning=true
      - uses: actions/upload-artifact@v4
        with:
          name: mindustry-ipa
          path: ios/build/robovm/*.ipa
