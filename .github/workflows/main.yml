name: Build iOS IPA
on: workflow_dispatch

env:
  MINDUSTRY_TAG: v160.7
  BUILD_VERSION: "160.7"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Mindustry at release tag
        uses: actions/checkout@v4
        with:
          repository: Anuken/Mindustry
          ref: ${{ env.MINDUSTRY_TAG }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clone Arc at the pinned commit
        run: |
          ARC_HASH=$(grep -i '^archash=' gradle.properties | cut -d= -f2)
          echo "Using Arc $ARC_HASH"
          git clone https://github.com/Anuken/Arc ../Arc
          git -C ../Arc checkout "$ARC_HASH"

      - name: Fetch MetalANGLEKit frameworks
        run: ./gradlew :Arc:backends:backend-robovm:extractMetalANGLEKit

      - name: Build Arc iOS natives
        run: ./gradlew :Arc:arc-core:jnigenBuildAllIOS

      - name: Add arc.xcframework to backend libs
        run: |
          cp -R ../Arc/arc-core/build/natives/arc.xcframework \
            ../Arc/backends/backend-robovm/res/META-INF/robovm/ios/libs/

      - name: Build IPA
        run: ./gradlew ios:createIPA -Probovm.iosSkipSigning=true -Pbuildversion=${{ env.BUILD_VERSION }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-${{ env.BUILD_VERSION }}-ipa
          path: ios/build/robovm/*.ipa
          if-no-files-found: error
